name: Landing checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build landing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm --package=vite-plus@1.6.0 dlx vp install --frozen-lockfile
      - name: Format, lint and typecheck
        run: pnpm check
      - name: Test landing
        run: pnpm test
      - name: Build landing
        run: pnpm build
