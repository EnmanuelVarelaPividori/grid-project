name: Check, build and deploy

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grid-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-build:
    name: Validate and build production image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies with Vite+
        run: pnpm --package=vite-plus@1.6.0 dlx vp install --frozen-lockfile
      - name: Format, lint and typecheck
        run: pnpm run check
      - name: Test
        run: pnpm run test
      - name: Validate deployment scripts
        run: |
          bash -n deploy/bootstrap.sh deploy/deploy.sh deploy/ssh-entrypoint.sh
          shellcheck deploy/*.sh
      - name: Build production image
        env:
          REVISION: ${{ github.sha }}
        run: docker build --build-arg "VCS_REF=$REVISION" --tag "grid-project:$REVISION" .
      - name: Smoke-test the actual production container
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker run -d --name grid-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --publish 127.0.0.1:8080:8080 \
            --env APP_ORIGIN=https://aigrunn.evarela.dev "grid-project:$REVISION"
          trap 'docker logs grid-ci; docker rm -f grid-ci' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/healthz > /tmp/health.json
          jq -e --arg sha "$REVISION" '.status == "ok" and .revision == $sha' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/ > /tmp/page.html
          grep -qi '<html' /tmp/page.html
          grep -q 'Set your limits' /tmp/page.html
      - name: Package deployable image
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: docker image save "grid-project:$REVISION" | gzip -1 > grid-project-image.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request'
        with:
          name: grid-project-image
          path: grid-project-image.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy to hiqual
    needs: check-and-build
    # Fork PRs never reach the origin. Enable after adding the three repository secrets.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://aigrunn.evarela.dev
    concurrency:
      group: grid-project-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: grid-project-image
      - name: Install verified Cloudflare client
        run: |
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          echo '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  /tmp/cloudflared' | sha256sum --check
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
      - name: Deliver image through authenticated SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || 'ssh-hiqual.giisoftware.com' }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'manu' }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY}"
          : "${TUNNEL_SERVICE_TOKEN_ID:?Missing CF_ACCESS_CLIENT_ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?Missing CF_ACCESS_CLIENT_SECRET}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          key="$RUNNER_TEMP/grid-deploy-key"
          known_hosts="$RUNNER_TEMP/grid-known-hosts"
          config="$RUNNER_TEMP/grid-ssh-config"
          trap 'rm -f "$key" "$known_hosts" "$config"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          cp deploy/ssh_known_hosts "$known_hosts"
          cat > "$config" <<EOF
          Host grid-origin
            HostName $SSH_HOST
            User $SSH_USER
            HostKeyAlias grid-project-hiqual
            IdentityFile $key
            IdentitiesOnly yes
            UserKnownHostsFile $known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
          ssh -F "$config" -T grid-origin "deploy $REVISION" < grid-project-image.tar.gz
          ssh -F "$config" -T grid-origin status
          {
            echo '### Origin deployment succeeded'
            echo "Revision: \`$REVISION\`"
            echo 'URL: https://aigrunn.evarela.dev'
            echo 'The origin healthcheck passed. Public reachability requires the Cloudflare hostname route.'
          } >> "$GITHUB_STEP_SUMMARY"
