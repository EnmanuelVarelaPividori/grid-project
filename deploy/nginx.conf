# Dedicated LAN/loopback origin for the existing Cloudflare Tunnel connector.
# Other virtual hosts and ports on hiqual are left untouched.
server {
    listen 192.168.178.39:3002;
    listen 127.0.0.1:3002;
    server_name aigrunn.evarela.dev;

    access_log /var/log/nginx/grid-project.access.log;
    error_log /var/log/nginx/grid-project.error.log;
    client_max_body_size 10m;

    location / {
        include /opt/grid-project/state/active-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host aigrunn.evarela.dev;
        proxy_set_header X-Forwarded-Host aigrunn.evarela.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
